name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and publish (for example v1.0.3)
        required: true
      replace_asset:
        description: Replace existing assets that differ, built from the tag (safe replace, never leaves the release without the asset)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Reject tags older than v1.0.3
        run: |
          # This step runs before checkout on purpose: older tags don't contain
          # the scripts the later steps need. Versions are compared numerically.
          re='^v([0-9]+)\.([0-9]+)\.([0-9]+)$'
          if ! [[ $TAG =~ $re ]]; then
            echo "Tag '$TAG' must look like v1.2.3." >&2
            exit 1
          fi
          cur=("$((10#${BASH_REMATCH[1]}))" "$((10#${BASH_REMATCH[2]}))" "$((10#${BASH_REMATCH[3]}))")
          min=(1 0 3)
          older=0
          for i in 0 1 2; do
            if [ "${cur[$i]}" -lt "${min[$i]}" ]; then older=1; break; fi
            if [ "${cur[$i]}" -gt "${min[$i]}" ]; then break; fi
          done
          if [ "$older" -eq 1 ]; then
            echo "Releases before v1.0.3 were published by an earlier workflow; this workflow supports v1.0.3 and later." >&2
            exit 1
          fi
          echo "Tag $TAG is supported."

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check HEAD is the tag's commit
        run: |
          tag_commit="$(git rev-parse "refs/tags/$TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "HEAD ($head_commit) is not the commit of tag $TAG ($tag_commit)." >&2
            exit 1
          fi

      - name: Validate
        run: |
          python3 -m pip install --quiet pyyaml==6.0.2
          python3 scripts/validate.py
          bash tests/test_install.sh
          bash tests/test_publish.sh

      - name: Build the Claude app zip and checksum
        run: |
          ./install.sh claude-app
          cd dist
          sha256sum model-router.zip > model-router.zip.sha256
          cat model-router.zip.sha256

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REPLACE_ASSET: ${{ inputs.replace_asset || 'false' }}
        run: |
          if [ "$REPLACE_ASSET" = "true" ]; then
            bash scripts/publish-release.sh "$TAG" --replace
          else
            bash scripts/publish-release.sh "$TAG"
          fi
