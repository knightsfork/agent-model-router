name: Release

on:
  push:
    tags: ['v*']
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag whose zip to rebuild from main (for example v1.0.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate
        run: |
          python3 -m pip install --quiet pyyaml
          python3 scripts/validate.py
          bash tests/test_install.sh

      - name: Build the Claude app zip
        run: ./install.sh claude-app

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/model-router.zip --clobber
          else
            gh release create "$TAG" dist/model-router.zip \
              --title "$TAG" \
              --notes "Download model-router.zip below and upload it as a custom skill in the Claude desktop app (also web and mobile). For Claude Code, Codex, Gemini CLI, Cursor and Copilot, see the README's Quick install. Details are in CHANGELOG.md."
          fi
